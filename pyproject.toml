[project]
name = "gold-rush"
version = "0.1.0"
description = "Kalshi and Polymarket prices on the games cassandra predicts, matched to ESPN games."
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    # Which ESPN team a venue's code is. The venue names live there, not
    # here, so a fix to a team's identity is one row in one place.
    "call-it-what-you-want",
    # The games a venue's markets are matched to, as endgame stores them.
    "endgame",
    # Reading those games, and writing what's pulled, from the bucket.
    "endgame-aws",
    "fire>=0.7.0",
]

[project.scripts]
gold-rush = "gold_rush.cli:main"

# None of these are published. The two EndGame packages are pinned to the
# revs cassandra pins, which agree with each other: endgame-aws at 78f7661
# resolves endgame at 9ec6c0f. Bump them together, and with cassandra.
#
# call-it-what-you-want at the main commit that filed Polymarket's codes for
# the four schools its roster leaves out and its 2025 football slugs
# (call-it-what-you-want#11). A venue code nobody had filed gets its row
# there, and then this pin moves.
[tool.uv.sources]
call-it-what-you-want = { git = "https://github.com/NathanDeMaria/call-it-what-you-want.git", rev = "904d49e2efa0f31b679ef208c8da79169ece5c35" }
endgame = { git = "https://github.com/NathanDeMaria/EndGame.git", rev = "9ec6c0f43018f43b5eb037ad8856aefaff6bd93c", subdirectory = "py-endgame" }
endgame-aws = { git = "https://github.com/NathanDeMaria/EndGame.git", rev = "78f76618b2b81cebb4a161775e057fb97d691d18", subdirectory = "py-endgame-aws" }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gold_rush"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# these just re-export names for the public API
"__init__.py" = ["F401"]
